<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lost & Found</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html"><img src="assests/logo.jpg" alt="Logo"></a></div>
        <h1>University Lost & Found Portal</h1>
        <nav class="nav-bar">
            <ul>
                <li><a href="index.html">Return to Home</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main class="login-page">
        <section class="login-panel">
            <div class="login-intro">
                <a href="index.html" class="back-link">← Back to Home</a>
                <h2>Welcome back</h2>
                <p>Log in to your lost and found portal to review reports, manage your profile, and submit new items.</p>
            </div>

            <form id="login-form" class="login-form">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>

                <button type="submit">Log In</button>
                <a href="#" class="forgot-password">Forgot password?</a>
            </form>

            <p class="signup-text">Don't have an account? <a href="signup.html">Create one</a></p>
        </section>
    </main>

    <script src="javascript.js"></script>
</body>
</html>
