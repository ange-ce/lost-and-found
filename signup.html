<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Lost & Found</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
        <header>
            <div class="logo"><a href="index.html"><img src="assests/logo.jpg " alt=" Logo"></a></div>
            <h1>University Lost & Found Portal</h1>
            <nav class="nav-bar">
                <ul>
                    <li><a href="index.html">Return to Home</a></li>
                    <li><a href="login.html">Log In</a></li>
                </ul>
            </nav>
        </header>  
    <main class="login-page">
        <section class="login-panel">
            <div class="login-intro">
                <a href="index.html" class="back-link">← Back to Home</a>
                <h2>Create your account</h2>
                <p>Register to submit reports, manage your profile, and track lost or found items faster.</p>
            </div>

            <form class="login-form">
                <label for="signup-fullname">Full Name</label>
                <input id="signup-fullname" type="text" placeholder="Your full name" required>

                <label for="signup-email">Email</label>
                <input id="signup-email" type="email" placeholder="you@example.com" required>

                <label for="signup-password">Password</label>
                <input id="signup-password" type="password" placeholder="Create a strong password" required>

                <button type="submit">Sign Up</button>
                <a href="login.html" class="forgot-password">Already have an account?</a>
            </form>

            <p class="signup-text">By signing up, you agree to our terms and privacy policy.</p>
        </section>
    </main>
</body>
</html>
